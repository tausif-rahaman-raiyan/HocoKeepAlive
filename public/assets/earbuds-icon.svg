<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0d1117" />
  
  <!-- Connecting cord -->
  <path d="M125 360 C125 435, 230 465, 260 465 C295 465, 395 440, 395 385" 
        fill="none" stroke="#161b22" stroke-width="26" stroke-linecap="round" />
  <path d="M125 360 C125 435, 230 465, 260 465 C295 465, 395 440, 395 385" 
        fill="none" stroke="#21262d" stroke-width="18" stroke-linecap="round" />

  <!-- LEFT EARBUD -->
  <!-- Stem -->
  <rect x="96" y="165" width="48" height="150" rx="24" fill="#e2e8f0" stroke="#0f172a" stroke-width="14" stroke-linejoin="round" />
  <!-- Earbud Head -->
  <circle cx="160" cy="155" r="82" fill="#f8fafc" stroke="#0f172a" stroke-width="14" />
  <!-- Inner shadow / contour -->
  <path d="M100 155 A 60 60 0 0 0 205 195" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- Left Eye -->
  <circle cx="132" cy="148" r="9" fill="#0f172a" />
  <!-- Right Eye -->
  <circle cx="188" cy="148" r="9" fill="#0f172a" />
  <!-- Smile mouth -->
  <path d="M150 162 Q 160 174 170 162" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
  <!-- Cheek blush -->
  <circle cx="122" cy="165" r="7" fill="#f43f5e" opacity="0.35" />
  <circle cx="198" cy="165" r="7" fill="#f43f5e" opacity="0.35" />

  <!-- RIGHT EARBUD -->
  <!-- Stem -->
  <rect x="368" y="270" width="48" height="140" rx="24" fill="#e2e8f0" stroke="#0f172a" stroke-width="14" stroke-linejoin="round" />
  <!-- Earbud Head -->
  <circle cx="340" cy="245" r="82" fill="#f8fafc" stroke="#0f172a" stroke-width="14" />
  <!-- Inner shadow / contour -->
  <path d="M280 245 A 60 60 0 0 0 385 285" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- Left Eye -->
  <circle cx="312" cy="238" r="9" fill="#0f172a" />
  <!-- Right Eye -->
  <circle cx="368" cy="238" r="9" fill="#0f172a" />
  <!-- Cute cat/w mouth -->
  <path d="M330 252 Q 335 261 340 254 Q 345 261 350 252" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cheek blush -->
  <circle cx="302" cy="255" r="7" fill="#f43f5e" opacity="0.35" />
  <circle cx="378" cy="255" r="7" fill="#f43f5e" opacity="0.35" />

  <!-- Small audio pulse indicator rings -->
  <circle cx="160" cy="155" r="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 16" opacity="0.4" />
  <circle cx="340" cy="245" r="104" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="10 16" opacity="0.4" />
</svg>
