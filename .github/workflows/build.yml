name: Build HOCO KeepAlive for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoco-keepalive-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build EXE, installer, and ZIP
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@v4

      - name: 2. Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 3. Set up Node.js for deterministic icon generation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Generate and validate headphone icon
        shell: pwsh
        run: |
          ./scripts/Generate-Icon.ps1
          if (!(Test-Path "assets/hoco-keepalive.ico")) {
            throw "Icon generation failed: assets/hoco-keepalive.ico does not exist."
          }
          $item = Get-Item "assets/hoco-keepalive.ico"
          if ($item.Length -lt 1000) {
            throw "Icon file is corrupted or too small ($($item.Length) bytes)."
          }
          Write-Host "Icon generated and validated: $($item.Length) bytes."

      - name: 5. Restore dependencies
        run: dotnet restore HocoKeepAlive.csproj

      - name: 6. Run automated tests
        shell: pwsh
        run: |
          if (Test-Path "tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj") {
            dotnet test tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj --configuration Release --logger "console;verbosity=normal"
          } else {
            Write-Host "Tests project not present, skipping test step."
          }

      - name: 7. Publish self-contained Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish HocoKeepAlive.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish

          $exePath = "publish/HOCO KeepAlive.exe"
          if (!(Test-Path $exePath)) {
            throw "Published executable was not found at $exePath."
          }
          $exeItem = Get-Item $exePath
          if ($exeItem.Length -lt 100000) {
            throw "Published executable appears incomplete or too small ($($exeItem.Length) bytes)."
          }
          Write-Host "Published self-contained executable validated: $($exeItem.Length) bytes."

      - name: 8. Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compilerPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compilerPath)) {
            throw "Inno Setup compiler was not found at $compilerPath."
          }
          Write-Host "Inno Setup found at $compilerPath"

      - name: 9. Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer-output" | Out-Null
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "installer.iss"
          $setupPath = "installer-output/HOCO-KeepAlive-Setup-1.0.0.exe"
          if (!(Test-Path $setupPath)) {
            throw "Installer EXE was not created at $setupPath."
          }
          $setupItem = Get-Item $setupPath
          if ($setupItem.Length -lt 100000) {
            throw "Installer file appears truncated ($($setupItem.Length) bytes)."
          }
          Write-Host "Windows setup installer validated: $($setupItem.Length) bytes."

      - name: 10. Create portable ZIP
        shell: pwsh
        run: |
          $zipPath = "HocoKeepAlive-Windows-x64.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $zipPath -Force
          if (!(Test-Path $zipPath)) {
            throw "Portable ZIP was not created at $zipPath."
          }
          $zipItem = Get-Item $zipPath
          if ($zipItem.Length -lt 100000) {
            throw "Portable ZIP appears empty or truncated ($($zipItem.Length) bytes)."
          }
          Write-Host "Portable ZIP created and validated: $($zipItem.Length) bytes."

      - name: 11. Upload Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HocoKeepAlive-Windows
          if-no-files-found: error
          path: |
            publish/HOCO KeepAlive.exe
            installer-output/HOCO-KeepAlive-Setup-1.0.0.exe
            HocoKeepAlive-Windows-x64.zip
          retention-days: 90

      - name: 12. Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/HOCO-KeepAlive-Setup-1.0.0.exe
            HocoKeepAlive-Windows-x64.zip
          generate_release_notes: true
