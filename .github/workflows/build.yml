name: HOCO KeepAlive — Single Windows Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update GitHub Release with Setup EXE"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hoco-keepalive-setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-setup:
    name: Build HOCO KeepAlive Windows 10/11 x64 Deliverables
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 3. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 4. Generate multi-resolution icon
        shell: pwsh
        run: |
          ./scripts/Generate-Icon.ps1
          if (!(Test-Path "assets/hoco-keepalive.ico")) {
            throw "Icon asset missing at assets/hoco-keepalive.ico"
          }
          $icon = Get-Item "assets/hoco-keepalive.ico"
          Write-Host "Application icon ready: $($icon.Length) bytes."

      - name: 5. Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore HocoKeepAlive.csproj
          if (Test-Path "tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj") {
            dotnet restore tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj
          }

      - name: 6. Run automated test suite
        shell: pwsh
        run: |
          if (Test-Path "tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj") {
            dotnet test tests/HocoKeepAlive.Tests/HocoKeepAlive.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
          } else {
            Write-Host "Tests project not present, skipping test step."
          }

      - name: 7. Publish self-contained Windows x64 binary
        shell: pwsh
        run: |
          dotnet publish HocoKeepAlive.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output publish

          $exe = "publish/HOCO KeepAlive.exe"
          if (!(Test-Path $exe)) {
            throw "Application executable not found at $exe."
          }
          Write-Host "Published binary validated at $exe ($((Get-Item $exe).Length) bytes)."

      - name: 8. Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc."
          }
          Write-Host "Inno Setup ready at $iscc"

      - name: 9. Compile Windows 10/11 Setup Installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer-output" | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer.iss"

          $setupExe = "installer-output/HOCO-KeepAlive-Setup-1.0.4.exe"
          if (!(Test-Path $setupExe)) {
            throw "Setup EXE was not produced at $setupExe."
          }
          $item = Get-Item $setupExe
          if ($item.Length -lt 100000) {
            throw "Setup EXE file is too small or corrupt ($($item.Length) bytes)."
          }
          Write-Host "SUCCESS: Windows Setup EXE generated at $setupExe ($($item.Length) bytes)."

      - name: 10. Create portable ZIP and standalone EXE package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "deliverables" | Out-Null
          Copy-Item "publish/HOCO KeepAlive.exe" "deliverables/HOCO-KeepAlive-1.0.4.exe"
          Compress-Archive -Path "publish/*" -DestinationPath "deliverables/HOCO-KeepAlive-Portable-1.0.4-win-x64.zip" -Force
          if (!(Test-Path "deliverables/HOCO-KeepAlive-1.0.4.exe")) { throw "Standalone EXE missing." }
          if (!(Test-Path "deliverables/HOCO-KeepAlive-Portable-1.0.4-win-x64.zip")) { throw "Portable ZIP missing." }

      - name: 11. Upload all Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HOCO-KeepAlive-Windows-v1.0.4
          path: |
            installer-output/HOCO-KeepAlive-Setup-1.0.4.exe
            deliverables/HOCO-KeepAlive-1.0.4.exe
            deliverables/HOCO-KeepAlive-Portable-1.0.4-win-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: 12. Create or update GitHub Release with all Windows deliverables
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/HOCO-KeepAlive-Setup-1.0.4.exe
            deliverables/HOCO-KeepAlive-1.0.4.exe
            deliverables/HOCO-KeepAlive-Portable-1.0.4-win-x64.zip
          name: "HOCO KeepAlive v1.0.4 (Windows 11 / 10 Setup)"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.4' }}
          draft: false
          prerelease: false
          generate_release_notes: true
