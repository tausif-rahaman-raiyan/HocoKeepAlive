name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate application icon
        shell: pwsh
        run: ./scripts/Generate-Icon.ps1
      - name: Restore
        run: dotnet restore HocoKeepAlive.csproj
      - name: Publish self-contained app
        run: dotnet publish HocoKeepAlive.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath HocoKeepAlive-Windows-x64.zip -Force
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: installer.iss
          options: /O+
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HocoKeepAlive-Windows
          path: |
            HocoKeepAlive-Windows-x64.zip
            installer-output/HOCO-KeepAlive-Setup-1.0.0.exe
          if-no-files-found: error
      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HocoKeepAlive-Windows-x64.zip
            installer-output/HOCO-KeepAlive-Setup-1.0.0.exe
