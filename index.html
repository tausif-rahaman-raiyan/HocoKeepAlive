<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/earbuds-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keep Alive</title>
    <meta name="description" content="Keep Alive - Bluetooth audio keep-alive utility to prevent wireless soundboxes and speakers from disconnecting during pauses." />
    <meta property="og:title" content="Keep Alive" />
    <meta property="og:description" content="Keep Alive - Bluetooth audio keep-alive utility to prevent wireless soundboxes and speakers from disconnecting during pauses." />
    <script>
      // Defensive shim: provide a setter on window.fetch so browser extensions / interceptors don't throw
      try {
        let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return _fetch;
          },
          set: function (newFetch) {
            _fetch = newFetch;
          },
          configurable: true,
          enumerable: true
        });
      } catch (_) {
        try {
          const f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            value: f,
            writable: true,
            configurable: true
          });
        } catch (__) {}
      }

      // Filter and prevent external browser extension errors from breaking application execution
      window.addEventListener('error', function (event) {
        if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
          event.preventDefault();
          return false;
        }
      });
    </script>
  </head>
  <body class="bg-[#0E1220] text-[#F5F7FF] antialiased min-h-screen selection:bg-[#C9D5FF] selection:text-[#0E1220]">
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
